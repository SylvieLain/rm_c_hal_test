version: "4.1"
name: peripheral_test
type: ARM
deviceName: STM32F407IGHx
packDir: null
srcDirs:
  - Hardware
  - BSP
  - APP
  - Algorithm
virtualFolder:
  name: <virtual_root>
  files: []
  folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: 309d25157d7870eab60fb2ef007860be
targets:
  Debug:
    cppPreprocessAttrs:
      defineList:
        - STM32F407xx
        - USE_HAL_DRIVER
        - HSE_VALUE=12000000
      incList:
        - Hardware/Core/Inc
        - Hardware/USB_DEVICE/App
        - Hardware/USB_DEVICE/Target
        - Hardware/Drivers/STM32F4xx_HAL_Driver/Inc
        - Hardware/Drivers/STM32F4xx_HAL_Driver/Inc/Legacy
        - Hardware/Drivers/CMSIS/Device/ST/STM32F4xx/Include
        - Hardware/Drivers/CMSIS/Include
        - Hardware/Middlewares/ST/STM32_USB_Device_Library/Core/Inc
        - Hardware/Middlewares/ST/STM32_USB_Device_Library/Class/CDC/Inc
        - BSP
        - APP/main
        - APP/public
        - BSP/BMI088
        - BSP/UART
        - BSP/CAN
        - BSP/Board
        - BSP/PWM
        - BSP/qd4310/can
        - APP/qd4310
        - Algorithm/PID
      libList: []
    excludeList:
      - Hardware/Drivers/CMSIS/Device/ST/STM32F4xx/Source/Templates
      - Hardware/MDK-ARM
    settings:
      debugger: cortex-debug
    toolchain: GCC
    toolchainConfigMap:
      GCC:
        archExtensions: ""
        cpuType: Cortex-M4
        floatingPointHardware: single
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler:
            ASM_FLAGS: ""
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: ""
            C_FLAGS: ""
            language-c: c11
            language-cpp: c++14
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-debug
            warnings: all-warnings
          global:
            $float-abi-type: hard
            misc-control: ""
            not-use-syscalls: true
            output-debug-info: enable
            use-newlib-nano: true
          linker:
            $outputTaskExcludes: []
            LIB_FLAGS: -lm
            output-format: elf
            remove-unused-input-sections: true
        scatterFilePath: Hardware\STM32F407XX_FLASH.ld
        storageLayout:
          RAM:
            - id: 1
              isChecked: true
              mem:
                size: "0x20000"
                startAddr: "0x20000000"
              noInit: false
              tag: IRAM
          ROM:
            - id: 1
              isChecked: true
              isStartup: true
              mem:
                size: "0x100000"
                startAddr: "0x08000000"
              tag: IROM
        useCustomScatterFile: true
    uploadConfigMap:
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: STM32F407IG
          vendor: ST
        otherCmds: ""
        proType: 1
        speed: 8000
      STLink:
        address: "0x08000000"
        bin: ""
        elFile: None
        optionBytes: .eide/debug.st.option.bytes.ini
        otherCmds: ""
        proType: SWD
        resetMode: SWrst
        runAfterProgram: true
        speed: 4000
      pyOCD:
        baseAddr: "0x08000000"
        bin: ""
        config: .eide/debug.pyocd.yaml
        otherCmds: ""
        speed: 4M
        targetName: STM32F407IGTx
    uploader: STLink
